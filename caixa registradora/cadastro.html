<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaixaPro - Criar Conta</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="cadastro-container">

        <section class="cadastro-box">
        
            <div class="logo">
                <h1>CaixaPro</h1>
                <p>Criar nova conta</p>
            </div>

           <form id="cadastro-form" action="php/cadastro.php" method="POST">

                <div class="form-group">
                    <label for="nome">Nome completo:</label><br>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

                </div>

                <div class="form-group">

                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                </div>

                <div class="form-group">

                    <label for="senha">Senha:</label><br>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>

                </div>

                <div class="form-group">

                    <label for="confirmar-senha">Confirmar senha </label><br>

                    <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite a senha novamente" required>

                </div>

                

                <div class="termos">

                    <label >

                        <input type="checkbox" id="termos" required>Termos<br>
                    </label>
                </div><br>

                <button type="submit" class="btn-cadastro">Criar conta</button>
            </form>

            <div class="login-link">

                <p>Já possui uma conta?</p>

                <a href="index.html">Voltar para o login</a>
            </div>
        </section>
    </main>

    <footer>
        <p>CaixaPro &copy; 2026</p>
    </footer>

    <script src="js/script.js"></script>
    
</body>
</html>
